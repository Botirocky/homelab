services:
  minecraft:
    image: itzg/minecraft-server:latest
    container_name: park-minecraft
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      - ${ADAT_DIR}/minecraft:/data
    environment:
      TZ: ${TZ}
      EULA: "TRUE"
      TYPE: ${MC_TIPUS:-PAPER}
      VERSION: ${MC_VERZIO:-LATEST}
      MEMORY: ${MC_MEMORIA:-2G}
      MOTD: ${MC_MOTD:-Szerverpark}
      MAX_PLAYERS: "10"
      VIEW_DISTANCE: "8"
      SIMULATION_DISTANCE: "6"
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${MC_RCON_JELSZO}
      MODRINTH_PROJECTS: ${MC_MODOK:-}
      ONLINE_MODE: "true"
      USE_AIKAR_FLAGS: "true"
      ENABLE_AUTOPAUSE: "true"
      AUTOPAUSE_TIMEOUT_EST: "600"
      MAX_TICK_TIME: "-1"
    stop_grace_period: 60s
    networks: [park]

networks:
  park:
    external: true
