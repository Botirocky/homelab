services:
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: park-kiwix
    restart: unless-stopped
    command: "*.zim"
    ports:
      - "8097:8080"
    volumes:
      - ${KIWIX_DIR}:/data:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [park]

networks:
  park:
    external: true
