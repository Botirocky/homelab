services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    container_name: park-immich
    restart: unless-stopped
    ports:
      - "2283:2283"
    volumes:
      - ${FOTO_DIR}:/data
      - /etc/localtime:/etc/localtime:ro
      - type: bind
        source: ${TAROLO_DIR:-/srv/tarolok}
        target: /tarolok
        read_only: true
        bind:
          propagation: rslave
    environment:
      TZ: ${TZ}
      DB_HOSTNAME: immich-db
      DB_USERNAME: immich
      DB_PASSWORD: ${IMMICH_DB_JELSZO}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_ENABLED: ${FOTO_ML_BE:-false}
      IMMICH_MACHINE_LEARNING_URL: http://immich-ml:3003
    depends_on:
      - immich-redis
      - immich-db
    networks: [park]

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: park-immich-redis
    restart: unless-stopped
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks: [park]

  immich-db:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: park-immich-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_JELSZO}
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - ${ADAT_DIR}/immich/db:/var/lib/postgresql/data
    shm_size: 128mb
    networks: [park]

networks:
  park:
    external: true
