services:
  orarend:
    build: .
    image: park-orarend:helyi
    container_name: park-orarend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ORAREND_HELYI_PORT:-8099}:8080"
    volumes:
      - ${ADAT_DIR}/orarend:/data
    environment:
      TZ: ${TZ}
      ORAREND_ICS_KULCS: ${ORAREND_ICS_KULCS:-}
      ORAREND_JELSZO: ${ORAREND_JELSZO:-}
      ORAREND_ERTESITES: ${ORAREND_ERTESITES:-be}
      ORAREND_ESTI_OSSZEFOGLALO: ${ORAREND_ESTI_OSSZEFOGLALO:-19:00}
      ORAREND_FRISSITES_PERC: ${ORAREND_FRISSITES_PERC:-20}
      NTFY_URL: ${ORAREND_NTFY_URL:-${NTFY_URL:-}}
      DISCORD_WEBHOOK: ${ORAREND_DISCORD_WEBHOOK:-}
    networks: [park]

networks:
  park:
    external: true
